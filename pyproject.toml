[project]
name = "mini-learning-model"
version = "0.0.10"
description = "Experimental recurrent graph language model"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["jax[cpu]>=0.4.35", "flax>=0.10", "optax>=0.2.4", "pydantic>=2.10", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlm"]

[project.scripts]
mlm = "mlm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
